name: Build add-on

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install scons markdown

      - name: Build add-on
        run: scons

      - name: Upload built add-on
        uses: actions/upload-artifact@v4
        with:
          name: enhancedDuck
          path: "*.nvda-addon"
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install scons markdown

      - name: Build add-on
        run: scons

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.nvda-addon"
          generate_release_notes: true
          fail_on_unmatched_files: true
